<div class="container-fluid">
  <!-- Dashboard Principal - 1 Coluna -->
  <div class="row">
    <!-- Coluna: Pacientes -->
    <div class="col-md-4 col-12 mb-3">
      <div class="card h-100">
        <div class="card-header bg-success text-white">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0">Pacientes</h5>
            <button 
              type="button" 
              class="btn btn-outline-success btn-sm add-patient-btn"
              (click)="openAddPatientModal()">
              <i class="fas fa-plus me-1"></i>
              Adicionar
            </button>
          </div>
          <!-- Filtro de Dia da Semana -->
          <div class="d-flex align-items-center">
            <label class="form-label me-2 mb-0 text-white">Filtrar por dia:</label>
            <select 
              class="form-select form-select-sm" 
              [(ngModel)]="selectedDayFilter"
              (change)="filterPatientsByDay()"
              style="width: auto;">
              <option value="">Todos os dias</option>
              <option value="1">Segunda-feira</option>
              <option value="2">Terça-feira</option>
              <option value="3">Quarta-feira</option>
              <option value="4">Quinta-feira</option>
              <option value="5">Sexta-feira</option>
            </select>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="patient-list">
            <div 
              *ngFor="let patient of filteredPatients" 
              class="patient-item border-bottom p-3">
              <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                  <h6 class="mb-1">{{ patient.name }}</h6>
                  
                  <!-- Horários de atendimento -->
                  <div class="mt-2" *ngIf="patient.appointments.length > 0">
                    <div class="appointment-schedule">
                      <div 
                        *ngFor="let appointment of patient.appointments" 
                        class="appointment-item mb-1">
                        <i class="fas fa-calendar-day me-1 text-primary"></i>
                        <span class="day-name">{{ getDayName(appointment.dayOfWeek) }}</span>
                        <span class="time-badge">{{ appointment.time }}</span>
                        <span 
                          *ngIf="appointment.isBiweekly" 
                          class="biweekly-indicator">
                          ({{ appointment.biweeklyWeek === 1 ? '1ª' : '2ª' }} semana)
                        </span>
                      </div>
                    </div>
                  </div>
                  
                  <div class="mt-2">
                    <span class="badge" [ngClass]="patient.scheduleType === 'weekly' ? 'bg-success' : 'bg-info'">
                      {{ patient.scheduleType === 'weekly' ? 'Semanal' : 'Quinzenal' }}
                    </span>
                  </div>
                </div>
                <div class="text-end">
                  <div class="btn-group btn-group-sm">
                    <button 
                      type="button" 
                      class="btn btn-outline-primary btn-sm"
                      (click)="editPatient(patient)">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button 
                      type="button" 
                      class="btn btn-outline-danger btn-sm"
                      (click)="deletePatient(patient)">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            
            <div *ngIf="filteredPatients.length === 0" class="text-center p-4 text-muted">
              <i class="fas fa-users fa-2x mb-2"></i>
              <p>Nenhum paciente cadastrado</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
