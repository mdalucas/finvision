<header class="d-flex justify-content-between align-items-center p-3 bg-success text-white">
  <h1 class="mb-0">CliniAgenda</h1>
  <nav class="d-flex gap-2">
    <button 
      class="btn btn-outline-light" 
      routerLink="/dashboard"
      routerLinkActive="active"
      [class.d-none]="isActiveRoute('/dashboard')">
      <i class="fas fa-home me-1"></i>
      Início
    </button>
    <button 
      class="btn btn-outline-light" 
      routerLink="/calendar"
      routerLinkActive="active"
      [class.d-none]="isActiveRoute('/calendar')">
      <i class="fas fa-calendar-alt me-1"></i>
      Calendário
    </button>
    <button 
      class="btn btn-outline-light" 
      routerLink="/weekly-grid"
      routerLinkActive="active"
      [class.d-none]="isActiveRoute('/weekly-grid')">
      <i class="fas fa-calendar-week me-1"></i>
      Grade Semanal
    </button>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
